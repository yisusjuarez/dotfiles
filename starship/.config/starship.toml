"$schema" = "https://starship.rs/config-schema.json"

palette = "dracula"
add_newline = true
command_timeout = 1000

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$nodejs\
$python\
$golang\
$aws\
$jobs\
$cmd_duration\
$status\
$line_break\
$character"""

[username]
format = "[$user]($style)@"
style_user = "cyan"
style_root = "bold red"

[hostname]
format = "[$hostname]($style) "
style = "cyan"

[directory]
style = "bold purple"
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"
read_only_style = "red"

[git_branch]
format = "[ $branch]($style) "
style = "pink"

[git_state]
format = "[$state( $progress_current/$progress_total)]($style) "
style = "bold yellow"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "red"
conflicted = "="
modified = "!"
staged = "+"
untracked = "?"
deleted = "✘"
renamed = "»"
stashed = "≡"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"

[nodejs]
format = "[$symbol$version]($style) "
symbol = " "
version_format = "${raw}"
style = "green"

[python]
format = "[$symbol$version( \\($virtualenv\\))]($style) "
symbol = " "
version_format = "${raw}"
style = "yellow"

[golang]
format = "[$symbol$version]($style) "
symbol = " "
version_format = "${raw}"
style = "cyan"

[aws]
format = "[$symbol$profile( \\($region\\))]($style) "
symbol = " "
style = "orange"

[jobs]
format = "[$symbol$number]($style) "
symbol = "✦"
style = "comment"

[cmd_duration]
format = "[󰔟 $duration]($style) "
min_time = 2000
style = "yellow"

[status]
disabled = false
format = "[✘ $status]($style) "
style = "red"

[character]
success_symbol = "[❯](bold purple)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[palettes.dracula]
background = "#282a36"
current_line = "#44475a"
foreground = "#f8f8f2"
comment = "#6272a4"
cyan = "#8be9fd"
green = "#50fa7b"
orange = "#ffb86c"
pink = "#ff79c6"
purple = "#bd93f9"
red = "#ff5555"
yellow = "#f1fa8c"
